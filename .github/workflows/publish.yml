name: Publish package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+: the npm 10.x bundled with Node 20 hits the arborist
          # "Cannot read properties of null (reading 'edgesOut')" bug on the
          # lockfile-less install below — v0.4.25's publish failed on exactly
          # that. npm 11 (Node 22+) resolves the same tree fine (verified in a
          # clean-room repro of this workflow's install step).
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@navanta-ai'

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./packages/design-system/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME (=$TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # The lockfile is generated on macOS and only resolves the darwin
      # rolldown native binding. Removing it forces npm to fully resolve
      # deps on the Linux runner so it can install the linux-x64 binding.
      # See npm/cli#4828.
      - run: rm -f package-lock.json && npm install --include=optional --no-audit --no-fund

      - run: npm run build -w packages/design-system

      - run: npm publish -w packages/design-system --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Publish package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@navanta-ai'

      # npm 10's arborist hits "Cannot read properties of null (reading
      # 'edgesOut')" on the lockfile-less install below — v0.4.25 and v0.4.28
      # both failed on exactly that. Node 22 bundles npm 10.9, NOT npm 11 (that
      # arrives with Node 23.5+), so pinning the Node version alone never
      # actually moved off the buggy resolver: the runs in between passed only
      # because the freshly-resolved graph happened not to trigger it, and a
      # registry change since was enough to bring it back. npm 11 resolves the
      # same tree fine (verified in a clean-room repro of this install step),
      # so ask for it explicitly instead of inferring it from the runtime.
      - run: npm install -g npm@11

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./packages/design-system/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME (=$TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # The lockfile is generated on macOS and only resolves the darwin
      # rolldown native binding. Removing it forces npm to fully resolve
      # deps on the Linux runner so it can install the linux-x64 binding.
      # See npm/cli#4828.
      - run: rm -f package-lock.json && npm install --include=optional --no-audit --no-fund

      - run: npm run build -w packages/design-system

      - run: npm publish -w packages/design-system --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
